[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-funnel"
version = "0.3.1"
description = "Funnel-shaped tool router for LLM agents with hundreds or thousands of tools: domain/stage routing, call-chain recommendation, argument prefill, MCP integration and online learning."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "tool-funnel contributors" }]
keywords = [
  "llm", "agent", "tool-calling", "function-calling", "tool-selection",
  "router", "context-engineering", "token-optimization", "mcp",
  "model-context-protocol", "tool-router", "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
tiktoken = ["tiktoken>=0.5"]
yaml = ["PyYAML>=5.4"]
mcp = ["mcp>=1.0"]
all = ["openai>=1.0", "tiktoken>=0.5", "PyYAML>=5.4"]
dev = ["pytest>=7", "PyYAML>=5.4", "tiktoken>=0.5"]

[project.scripts]
tool-funnel = "toolfunnel.cli:main"

[project.urls]
Homepage = "https://github.com/1428514215-create/tool-funnel"
Repository = "https://github.com/1428514215-create/tool-funnel"
Issues = "https://github.com/1428514215-create/tool-funnel/issues"
Changelog = "https://github.com/1428514215-create/tool-funnel/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["toolfunnel*"]

[tool.setuptools.package-data]
"toolfunnel.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
