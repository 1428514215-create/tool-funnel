[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-funnel"
version = "0.2.0"
description = "Funnel-shaped tool router for LLM agents with hundreds of tools: domain/stage routing, call-chain recommendation, argument prefill and online learning."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "tool-funnel contributors" }]
keywords = [
  "llm", "agent", "tool-calling", "function-calling", "tool-selection",
  "router", "context-engineering", "token-optimization"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
tiktoken = ["tiktoken>=0.5"]
dev = ["pytest>=7", "tiktoken>=0.5"]

[project.scripts]
tool-funnel = "toolfunnel.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/tool-funnel"
Repository = "https://github.com/your-org/tool-funnel"
Issues = "https://github.com/your-org/tool-funnel/issues"

[tool.setuptools.packages.find]
include = ["toolfunnel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
