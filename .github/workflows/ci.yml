name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core only, no optional deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install test deps
        run: pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run the demo (no API key required)
        run: python examples/demo.py --tools 300

      - name: Run the benchmark
        run: python benchmarks/bench.py --tools 500 --queries 50 --train-sessions 200

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check toolfunnel tests examples benchmarks --select E9,F63,F7,F82,F401,F811,F841 || true
