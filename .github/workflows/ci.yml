name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Python 3.8 is no longer available on ubuntu-latest (24.04/26.04), so the
    # oldest supported interpreter is pinned to the last image that still ships
    # it. Newer versions run on the default image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core only, no optional deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install test deps
        run: pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run the demo (no API key required)
        run: python examples/demo.py --tools 300

      - name: Run the MCP demo (offline, fake session)
        run: python examples/mcp_demo.py

      - name: Run the benchmark
        run: python benchmarks/bench.py --tools 500 --queries 50 --train-sessions 200

      - name: Exercise the installed CLI entry points
        run: |
          python -m toolfunnel.cli demo
          python -m toolfunnel.cli catalog --tools 200 --out /tmp/cat.json
          python -m toolfunnel.cli route /tmp/cat.json "查订单"

      - name: Build and smoke-test the standalone zipapp
        run: |
          python tools/build_zipapp.py
          python dist/tool-funnel.pyz --version
          python dist/tool-funnel.pyz demo
          python dist/tool-funnel.pyz catalog --tools 300 --out /tmp/cat2.json
          python dist/tool-funnel.pyz bench /tmp/cat2.json --queries 20

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check toolfunnel tests examples benchmarks tools --select E9,F63,F7,F82,F401,F811,F841
